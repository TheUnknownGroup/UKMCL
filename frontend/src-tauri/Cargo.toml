[package]
name = "frontend"
version.workspace = true
description = "UKMCL App"
authors = ["devonk15"]
edition = "2024"

[lib]
name = "frontend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# auth = { path = "../../crates/auth" }
# acore = { path = "../../crates/acore" }
# get = { path = "../../crates/get" }
# download = { path = "../../crates/download" }
# middle_man = { path = "../../crates/middle_man" }
# types = { path = "../../crates/types" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

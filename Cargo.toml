[workspace]
members = [
    "frontend/src-tauri",
    "crates/utils",
    "crates/java",
    "crates/auth",
    "crates/config",
    "crates/maker"
]

default-members = ["frontend/src-tauri"]
resolver = "1"

[workspace.package]
version = "2.0.0"
edition = "2024"
authors = ["devonk15"]

[workspace.dependencies]
dotenv = "0.15"
reqwest = { version = "0.13", features = ["json", "form"] } 
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.8"
uuid = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
toml = "1"
dirs = "6"
futures = "0.3"
futures-util = "0.3"
zip = "9"
sha1 = "0.11"
hex = "0.4"
urlencoding = "2"
notify = "8"

utils = { path = "./crates/utils" }
auth = { path = "./crates/auth" }
config = { path = "./crates/config" }
json_minecraft = { path = "./crates/json" }
maker = { path = "./crates/maker" }
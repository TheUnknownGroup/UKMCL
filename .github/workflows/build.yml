name: "create iced app"

on:
    push:
        branches:
          - main
    workflow_dispatch:

env:
    ver: 3.0.0

jobs:
    build:
        if: ${{ !contains(github.event.head_commit.message, '[skip]') }}
        runs-on: ${{ matrix.os }}
        strategy:
          matrix:
            include:
              - name: macos-arm64
                os: macos-15
                args: aarch64-apple-darwin
              - name: macos-intel
                os: macos-15-intel
                args: x86_64-apple-darwin
              - name: linux-x64
                os: ubuntu-24.04
                args: x86_64-unknown-linux-gnu
              - name: linux-arm64
                os: ubuntu-24.04-arm
                args: aarch64-unknown-linux-gnu
              - name: windows-x64
                os: windows-latest
                args: x86_64-pc-windows-msvc
              - name: windows-arm64
                os: windows-11-arm
                args: aarch64-pc-windows-msvc
        steps:
            - uses: actions/checkout@v7
            
            - name: rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: stable
                targets: ${{ matrix.args }}  

            - name: Install Linux dependencies
              if: startsWith(matrix.os, 'ubuntu-')
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential pkg-config libssl-dev cmake libclang-dev libudev-dev libasound2-dev liblzma-dev libfontconfig1-dev libfreetype6-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libwayland-dev

            - run: cargo build --release --package ukmcl --target ${{ matrix.args }}
            - run: cargo install cargo-packager --locked
            - run: cargo packager --release --target ${{ matrix.args }} --out-dir "${{ github.workspace }}/target/${{ matrix.args }}/release"
            
            - name: release ${{ matrix.name }}
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  retention-days: 3
                  path: |
                      ${{ github.workspace }}/target/${{ matrix.args }}/release/ukmcl_3*.*
                      ${{ github.workspace }}/target/${{ matrix.args }}/release/UKMCL_3*.*

    release:
        runs-on: ubuntu-latest
        needs: [ build ]
        permissions:
            contents:
                write
        steps:
            - uses: actions/checkout@v7
            
            - name: download
              uses: actions/download-artifact@v8
              with:
                  path: final
                  merge-multiple: true

            - name: release them
              uses: softprops/action-gh-release@v3
              with:
                  name: UKMCL v${{ env.ver }}
                  tag_name: v${{ env.ver }}
                  body_path: ${{ github.workspace}}/changelog.md
                  generate_release_notes: true
                  make_latest: true
                  files: |
                       final/**    
                  
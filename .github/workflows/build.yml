name: test build
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ver: 0.0.1

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip]') }}
    strategy:
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            up: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            up: "x86_64-apple-darwin"
          - platform: "ubuntu-latest"
            args: ""
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7

      - name: setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: ubuntu deps
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend deps
        run: bun install
        working-directory: ${{ env.working-directory }}

      - name: tauri build
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ env.working-directory }}
          tauriScript: "bun tauri"
          args: ${{ matrix.args }}

      - name: release (windows)
        if: ${{ matrix.platform == 'windows-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: exe
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/release/bundle/nsis/*.exe
            ${{ github.workspace }}/target/release/bundle/msi/*.msi

      - name: release (ubuntu)
        if: ${{ matrix.platform == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: deb
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/release/bundle/deb/*.deb
            ${{ github.workspace }}/target/release/bundle/rpm/*.rpm
            ${{ github.workspace }}/target/release/bundle/appimage/*.AppImage

      - name: release (macos)
        if: ${{ matrix.platform == 'macos-latest' && matrix.up == 'aarch64-apple-darwin'}}
        uses: actions/upload-artifact@v7
        with:
          name: dmg aarch
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz

      - name: release (macos)
        if: ${{ matrix.platform == 'macos-latest' && matrix.up == 'x86_64-apple-darwin'}}
        uses: actions/upload-artifact@v7
        with:
          name: dmg x86
          retention-days: 3
          path: |
            ${{ github.workspace }}/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
  release:
    if: ${{ contains(github.event.head_commit.message, '[re]') }}

    needs: [ build ]
    permissions:
      contents:
        write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: download
        uses: actions/download-artifact@v8
        with:
          path: finals
          merge-multiple: true
      - run: ls -R finals/

      - run: |
          mkdir -p final
          mv finals/appimage/*.AppImage final/
          mv finals/deb/*.deb final/
          mv finals/rpm/*.rpm final/
          mv finals/dmg/*.dmg final/
          mv finals/macos/*.tar.gz final/
          mv finals/msi/*.msi final/
          mv finals/nsis/*.exe final/
          ls -R final/
          cd final/
          mv ukmcl_${{ env.ver }}_x64-setup.exe ukmcl-${{ env.ver }}-windows_x64.exe
          mv ukmcl_${{ env.ver }}_x64_en-US.msi ukmcl-${{ env.ver }}-windows_x64.msi
          mv ukmcl_${{ env.ver }}_amd64.deb ukmcl-${{ env.ver }}-linux_x64.deb
          mv ukmcl_${{ env.ver }}_amd64.AppImage ukmcl-${{ env.ver }}-linux_x64.AppImage
          mv ukmcl-${{ env.ver }}-1.x86_64.rpm ukmcl-${{ env.ver }}-redhat_x64.rpm
          mv ukmcl_${{ env.ver }}_aarch64.dmg ukmcl-${{ env.ver }}-macos_arm64.dmg
          mv ukmcl_${{ env.ver }}_x64.dmg ukmcl-${{ env.ver }}-macos_x64.dmg

      - name: release them
        uses: softprops/action-gh-release@v3
        with:
          name: UKMCL v${{ env.ver }}
          tag_name: v${{ env.ver }}
          body_path: ./changelog.md
          generate_release_notes: true
          make_latest: true
          draft: true
          files: |
            final/*.*